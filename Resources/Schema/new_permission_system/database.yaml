# 新权限系统数据库Schema定义
# 用于用户管理模块，独立于老权限系统
database: 新权限系统数据库
version: 1.0
description: 新权限系统 - 独立于老权限系统，用于用户管理模块

tables:
  # ── 系统用户表 ──
  - name: nc_sys_users
    comment: 系统用户表，存储用户账号和基本信息
    columns:
      - name: id
        type: integer
        nullable: false
        primaryKey: true
        comment: 主键ID，自增整数
      - name: username
        type: character varying(50)
        nullable: false
        comment: 用户名，用于登录，唯一标识
      - name: password_hash
        type: character varying(255)
        nullable: false
        comment: 密码哈希值，BCrypt加密存储
      - name: full_name
        type: character varying(100)
        nullable: true
        comment: 用户真实姓名
      - name: phone
        type: character varying(20)
        nullable: true
        comment: 手机号码
      - name: identity_card
        type: character varying(18)
        nullable: true
        comment: 身份证号码，18位
      - name: position
        type: character varying(100)
        nullable: true
        comment: 职位职务
      - name: organization_id
        type: integer
        nullable: true
        comment: 所属组织机构ID，关联nc_sys_organizations.id
      - name: is_active
        type: boolean
        nullable: true
        comment: 是否启用，false表示禁用用户
      - name: is_password_change_required
        type: boolean
        nullable: true
        comment: 是否需要修改密码，首次登录时为true
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: updated_at
        type: timestamp without time zone
        nullable: true
        comment: 最后更新时间
      - name: created_by
        type: character varying(100)
        nullable: true
        comment: 创建人用户名

  # ── 系统角色表 ──
  - name: nc_sys_roles
    comment: 系统角色表，定义系统中的角色
    columns:
      - name: id
        type: integer
        nullable: false
        primaryKey: true
        comment: 主键ID，自增整数
      - name: name
        type: character varying(100)
        nullable: false
        comment: 角色名称，如"管理员"、"操作员"
      - name: code
        type: character varying(50)
        nullable: false
        comment: 角色代码，唯一标识，如"ADMIN"、"OPERATOR"
      - name: description
        type: text
        nullable: true
        comment: 角色描述说明
      - name: level
        type: integer
        nullable: true
        comment: 角色级别，数值越小权限越高（1=超级管理员，6=普通用户），仅用于排序展示
      - name: data_scope
        type: character varying(30)
        nullable: true
        comment: 数据范围（SELF/ORG/ORG_AND_CHILDREN/ALL），决定角色可访问的业务数据边界，多角色取最大

  # ── 组织机构表 ──
  - name: nc_sys_organizations
    comment: 组织机构表，存储行政区划和机构信息
    columns:
      - name: id
        type: integer
        nullable: false
        primaryKey: true
        comment: 主键ID，自增整数
      - name: name
        type: character varying(200)
        nullable: false
        comment: 机构名称
      - name: abbreviation
        type: character varying(50)
        nullable: true
        comment: 机构简称
      - name: principal
        type: character varying(100)
        nullable: true
        comment: 负责人姓名
      - name: phone
        type: character varying(20)
        nullable: true
        comment: 联系电话
      - name: principal_identity_card
        type: character varying(18)
        nullable: true
        comment: 负责人身份证号
      - name: address
        type: text
        nullable: true
        comment: 机构地址
      - name: postal_code
        type: character varying(10)
        nullable: true
        comment: 邮政编码
      - name: parent_id
        type: integer
        nullable: true
        comment: 上级机构ID，关联本表id，实现树形结构
      - name: institution_nature
        type: character varying(50)
        nullable: true
        comment: 机构性质，如"行政机关"、"事业单位"
      - name: institution_type
        type: character varying(50)
        nullable: true
        comment: 机构类型，如"民政局"、"街道办"
      - name: is_special_care_institution
        type: boolean
        nullable: true
        comment: 是否为特困供养机构
      - name: institution_category
        type: character varying(50)
        nullable: true
        comment: 机构类别，如"集中供养"、"分散供养"
      - name: city_id
        type: integer
        nullable: true
        comment: 所属城市ID，关联地区表
      - name: county_id
        type: integer
        nullable: true
        comment: 所属区县ID，关联地区表
      - name: town_id
        type: integer
        nullable: true
        comment: 所属乡镇/街道ID，关联地区表
      - name: village_id
        type: integer
        nullable: true
        comment: 所属村/社区ID，关联地区表
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: updated_at
        type: timestamp without time zone
        nullable: true
        comment: 最后更新时间

  # ── 权限定义表 ──
  - name: nc_sys_permissions
    comment: 权限定义表，定义系统中所有可分配的权限
    columns:
      - name: code
        type: character varying(50)
        nullable: false
        unique: true
        comment: 权限代码，唯一标识，如"USER_VIEW"、"ROLE_MANAGE"
      - name: name
        type: character varying(100)
        nullable: false
        comment: 权限名称，如"查看用户"、"管理角色"
      - name: module
        type: character varying(50)
        nullable: false
        comment: 所属模块，如"用户管理"、"角色管理"
      - name: description
        type: text
        nullable: true
        comment: 权限详细描述
      - name: sort_order
        type: integer
        nullable: true
        comment: 排序序号，用于前端显示顺序
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间

  # ── 用户角色关联表 ──
  - name: nc_sys_user_roles
    comment: 用户角色关联表，实现用户与角色的多对多关系
    columns:
      - name: user_id
        type: integer
        nullable: false
        primaryKey: true
        comment: 用户ID，关联nc_sys_users.id
      - name: role_id
        type: integer
        nullable: false
        primaryKey: true
        comment: 角色ID，关联nc_sys_roles.id

  # ── 角色权限关联表 ──
  - name: nc_perm_role_permissions
    comment: 角色权限关联表，实现角色与权限的多对多关系
    columns:
      - name: role_id
        type: integer
        nullable: false
        primaryKey: true
        comment: 角色ID，关联nc_sys_roles.id
      - name: permission_code
        type: character varying(50)
        nullable: false
        primaryKey: true
        comment: 权限代码，关联nc_sys_permissions.code
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间

  # ── 用户权限关联表 ──
  - name: nc_perm_user_permissions
    comment: 用户权限关联表，实现用户直接授权（优先级高于角色权限）
    columns:
      - name: user_id
        type: integer
        nullable: false
        comment: 用户ID，关联nc_sys_users.id
      - name: permission_code
        type: character varying(50)
        nullable: false
        comment: 权限代码，关联nc_sys_permissions.code
      - name: granted_at
        type: timestamp without time zone
        nullable: true
        comment: 授权时间
      - name: granted_by
        type: integer
        nullable: true
        comment: 授权人ID，关联nc_sys_users.id

  # ── 权限缓存版本表 ──
  - name: nc_perm_cache_version
    comment: 权限缓存版本表，用于权限变更时刷新缓存
    columns:
      - name: key
        type: character varying(50)
        nullable: false
        comment: 缓存键名，如"user_permissions"、"role_permissions"
      - name: version
        type: bigint
        nullable: false
        comment: 版本号，每次权限变更时递增
      - name: updated_at
        type: timestamp without time zone
        nullable: true
        comment: 最后更新时间

