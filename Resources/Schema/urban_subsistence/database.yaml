database: urban_subsistence
version: 2.0
description: 城市低保数据库 - 导入城市低保家庭台账数据

tables:
  - name: nc_biz_urban_subsistence_families
    comment: "[导入台账] 城市低保家庭表 - 导入城市低保家庭基本信息（户主/人数/保障金额）"
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: applicant_name
        type: VARCHAR(50)
        nullable: false
        comment: 户主姓名
      - name: applicant_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: family_size
        type: INTEGER
        default: 1
        comment: 家庭人口数
      - name: guarantee_size
        type: INTEGER
        default: 0
        comment: 保障人口数
      - name: monthly_income
        type: NUMERIC(12,2)
        comment: 家庭月总收入（元）
      - name: per_capita_monthly_income
        type: NUMERIC(12,2)
        comment: 家庭月均收入（元）
      - name: monthly_guarantee_amount
        type: NUMERIC(12,2)
        comment: 户月保障金额（元）
      - name: family_classified_amount
        type: NUMERIC(12,2)
        comment: 家庭分类施保总额（元）
      - name: person_classified_amount
        type: NUMERIC(12,2)
        comment: 人员分类施保总额（元）
      - name: total_amount
        type: NUMERIC(12,2)
        comment: 合计（元）
      - name: phone
        type: VARCHAR(20)
        comment: 联系电话
      - name: address
        type: VARCHAR(500)
        comment: 家庭住址
      - name: province
        type: VARCHAR(50)
        comment: 所属省级
      - name: city
        type: VARCHAR(50)
        comment: 所属市级
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区
      - name: certificate_number
        type: VARCHAR(50)
        comment: 低保（特困）证号
      - name: first_receive_month
        type: VARCHAR(10)
        comment: 最初享受月份
      - name: apply_reason
        type: VARCHAR(100)
        comment: 申请原因
      - name: calculation_method
        type: VARCHAR(20)
        comment: 救助金计算方式
      - name: grade_type
        type: VARCHAR(50)
        comment: 分档类型
      - name: bank_name
        type: VARCHAR(100)
        comment: 开户银行
      - name: bank_account_name
        type: VARCHAR(50)
        comment: 银行账户名称
      - name: bank_account
        type: VARCHAR(50)
        comment: 银行帐号
      - name: one_card_account
        type: VARCHAR(50)
        comment: 一卡通账号
      - name: housing_count
        type: INTEGER
        comment: 拥有产权住房套数
      - name: housing_area
        type: NUMERIC(10,2)
        comment: 住房总面积（平方米）
      - name: financial_assets
        type: NUMERIC(12,2)
        comment: 金融资产总额（元）
      - name: other_property
        type: VARCHAR(200)
        comment: 其他家庭财产情况
      - name: member_names
        type: TEXT
        comment: 家庭成员姓名（分号分隔）
      - name: member_id_cards
        type: TEXT
        comment: 家庭成员身份证号（分号分隔）
      - name: imported_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_urban_subsistence_family_id_card
        type: UNIQUE
        columns: [applicant_id_card]
    indexes:
      - name: idx_urban_families_id_card
        columns: [applicant_id_card]
      - name: idx_urban_families_district
        columns: [district]
      - name: idx_urban_families_street
        columns: [street]

  - name: nc_biz_urban_subsistence_persons
    comment: "[导入台账] 城市低保人员表 - 记录城市低保家庭成员详细信息（健康/残疾/就学/就业）"
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: family_id
        type: BIGINT
        comment: 所属家庭ID
      - name: head_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: name
        type: VARCHAR(50)
        nullable: false
        comment: 姓名
      - name: id_card
        type: VARCHAR(18)
        nullable: false
        comment: 身份证号
      - name: relationship
        type: VARCHAR(20)
        comment: 与户主关系
      - name: gender
        type: VARCHAR(10)
        comment: 性别
      - name: birth_date
        type: DATE
        comment: 出生日期
      - name: age
        type: INTEGER
        comment: 年龄
      - name: ethnicity
        type: VARCHAR(20)
        comment: 民族
      - name: marital_status
        type: VARCHAR(20)
        comment: 婚姻状况
      - name: education_level
        type: VARCHAR(20)
        comment: 文化程度
      - name: political_status
        type: VARCHAR(20)
        comment: 政治面貌
      - name: employment_status
        type: VARCHAR(50)
        comment: 就业状况
      - name: monthly_income
        type: NUMERIC(12,2)
        comment: 月收入（元）
      - name: is_disabled
        type: BOOLEAN
        default: false
        comment: 是否残疾人
      - name: disability_certificate
        type: VARCHAR(50)
        comment: 残疾证号
      - name: disability_type
        type: VARCHAR(20)
        comment: 残疾类别
      - name: disability_level
        type: VARCHAR(10)
        comment: 残疾等级
      - name: disease_type
        type: VARCHAR(100)
        comment: 患病病种
      - name: work_capacity
        type: VARCHAR(20)
        comment: 劳动能力
      - name: health_status
        type: VARCHAR(20)
        comment: 健康状况
      - name: insurance_type
        type: VARCHAR(50)
        comment: 参保类型
      - name: first_receive_month
        type: VARCHAR(10)
        comment: 最初享受月份
      - name: is_poverty_household
        type: BOOLEAN
        default: false
        comment: 是否建档立卡扶贫对象
      - name: bank_name
        type: VARCHAR(100)
        comment: 开户银行
      - name: bank_account_name
        type: VARCHAR(50)
        comment: 银行账户名称
      - name: bank_account
        type: VARCHAR(50)
        comment: 银行帐号
      - name: one_card_account
        type: VARCHAR(50)
        comment: 一卡通账户
      - name: assistance_type
        type: VARCHAR(50)
        comment: 救助类型
      - name: monthly_guarantee_amount
        type: NUMERIC(12,2)
        comment: 户月保障金额（元）
      - name: family_classified_amount
        type: NUMERIC(12,2)
        comment: 家庭分类施保金额（元）
      - name: total_classified_amount
        type: NUMERIC(12,2)
        comment: 合计分类施保金额（元）
      - name: calculation_method
        type: VARCHAR(20)
        comment: 救助金计算方式
      - name: grade_type
        type: VARCHAR(50)
        comment: 分档类型
      - name: total_amount
        type: NUMERIC(12,2)
        comment: 合计（元）
      - name: school_name
        type: VARCHAR(100)
        comment: 在读学校名称
      - name: school_nature
        type: VARCHAR(50)
        comment: 在读学校性质
      - name: enrollment_date
        type: VARCHAR(20)
        comment: 在读学校入学时间
      - name: employer_name
        type: VARCHAR(100)
        comment: 在职单位名称
      - name: employer_nature
        type: VARCHAR(50)
        comment: 在职单位性质
      - name: employer_location
        type: VARCHAR(100)
        comment: 在职单位地点
      - name: remark
        type: TEXT
        comment: 备注
      - name: province
        type: VARCHAR(50)
        comment: 所属省级
      - name: city
        type: VARCHAR(50)
        comment: 所属市级
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区
      - name: family_address
        type: VARCHAR(500)
        comment: 家庭地址
      - name: certificate_number
        type: VARCHAR(50)
        comment: 低保（特困）证号
      - name: imported_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_urban_subsistence_person_id_card
        type: UNIQUE
        columns: [id_card]
    indexes:
      - name: idx_urban_persons_id_card
        columns: [id_card]
      - name: idx_urban_persons_head_id_card
        columns: [head_id_card]
      - name: idx_urban_persons_family_id
        columns: [family_id]

views: []
