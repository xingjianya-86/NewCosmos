# 自理能力评估表 Schema 定义
# 列定义与实际数据库结构对齐（对齐日期 2026-08-17）；索引/外键与 DB 现状一致
database: cosmos_app
version: 2.0
description: 特困供养人员自理能力评估 - 评估进食/穿衣/如厕/行走/洗澡等6项能力

tables:
  - name: nc_biz_self_care_assessments
    comment: "[经济状况] 自理能力评估表 - 评估特困人员自理能力（进食/穿衣/上下床/如厕/行走/洗澡）"
    columns:
      - name: id
        type: BIGSERIAL
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: BIGINT
        nullable: false
        comment: 关联申请ID
      - name: member_id
        type: BIGINT
        nullable: true
        comment: 关联成员ID
      - name: can_eat_independently
        type: BOOLEAN
        nullable: true
        comment: 能否自主进食
      - name: can_dress_independently
        type: BOOLEAN
        nullable: true
        comment: 能否自主穿衣
      - name: can_get_in_out_of_bed
        type: BOOLEAN
        nullable: true
        comment: 能否自主上下床
      - name: can_use_toilet_independently
        type: BOOLEAN
        nullable: true
        comment: 能否自主如厕
      - name: can_walk_indoors
        type: BOOLEAN
        nullable: true
        comment: 能否室内行走
      - name: can_bathe_independently
        type: BOOLEAN
        nullable: true
        comment: 能否自主洗澡
      - name: assessment_date
        type: DATE
        nullable: true
        comment: 评估日期
      - name: assessor_name
        type: VARCHAR(100)
        nullable: true
        comment: 评估人姓名
      - name: remarks
        type: TEXT
        nullable: true
        comment: 备注
      - name: created_at
        type: TIMESTAMP
        nullable: true
        defaultValue: 'NOW()'
        comment: 创建时间
      - name: deleted_at
        type: TIMESTAMP
        nullable: true
        comment: 删除时间（软删除标记）
    indexes:
      - name: idx_self_care_assessments_application_id
        columns: [application_id]
    foreignKeys:
      - name: fk_self_care_assessments_application
        columns: [application_id]
        references:
          table: nc_biz_applications
          columns: [id]
        onDelete: CASCADE