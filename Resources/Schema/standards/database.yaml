    comment: nc_config_income_standards
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: id
      - name: hukou_type
        type: character varying(50)
        nullable: false
        comment: hukou_type
      - name: monthly_standard
        type: NUMERIC(18,2)
        nullable: false
        comment: monthly_standard
      - name: effective_start_date
        type: date
        nullable: false
        comment: effective_start_date
      - name: effective_end_date
        type: date
        nullable: false
        comment: effective_end_date
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: created_at
      - name: updated_at
        type: timestamp without time zone
        nullable: true
        comment: updated_at

