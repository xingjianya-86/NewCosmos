database: destitute
version: 1.0
description: 特困人员数据库

tables:
  - name: nc_biz_destitute_families
    comment: 特困人员家庭数据表
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: applicant_name
        type: VARCHAR(50)
        nullable: false
        comment: 户主姓名
      - name: applicant_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: family_size
        type: INTEGER
        default: 1
        comment: 家庭人口数
      - name: destitute_count
        type: INTEGER
        default: 0
        comment: 特困人员数
      - name: support_mode
        type: VARCHAR(20)
        comment: 供养方式
      - name: hukou_type
        type: VARCHAR(20)
        comment: 户籍类型
      - name: basic_living_cost
        type: NUMERIC(12,2)
        comment: 基本生活总费用（元）
      - name: care_cost
        type: NUMERIC(12,2)
        comment: 照料护理总费用（元）
      - name: family_classified_amount
        type: NUMERIC(12,2)
        comment: 家庭分类施保总额（元）
      - name: person_classified_amount
        type: NUMERIC(12,2)
        comment: 人员分类施保总额（元）
      - name: total_amount
        type: NUMERIC(12,2)
        comment: 合计（元）
      - name: certificate_number
        type: VARCHAR(50)
        comment: 低保（特困）证号
      - name: phone
        type: VARCHAR(20)
        comment: 联系电话
      - name: hukou_address
        type: VARCHAR(500)
        comment: 户籍住址
      - name: province
        type: VARCHAR(50)
        comment: 所属省级
      - name: city
        type: VARCHAR(50)
        comment: 所属市级
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区
      - name: first_receive_month
        type: VARCHAR(10)
        comment: 最初享受月份
      - name: bank_name
        type: VARCHAR(100)
        comment: 开户银行
      - name: bank_account_name
        type: VARCHAR(50)
        comment: 银行账户名称
      - name: bank_account
        type: VARCHAR(50)
        comment: 银行帐号
      - name: one_card_account
        type: VARCHAR(50)
        comment: 一卡通账号
      - name: meter_number
        type: VARCHAR(50)
        comment: 电表号
      - name: housing_count
        type: INTEGER
        comment: 拥有产权住房套数
      - name: housing_area
        type: NUMERIC(10,2)
        comment: 住房总面积（平方米）
      - name: financial_assets
        type: NUMERIC(12,2)
        comment: 金融资产总额（元）
      - name: other_property
        type: VARCHAR(200)
        comment: 其他家庭财产情况
      - name: member_names
        type: TEXT
        comment: 家庭成员姓名（分号分隔）
      - name: member_id_cards
        type: TEXT
        comment: 家庭成员身份证号（分号分隔）
      - name: imported_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_destitute_family_id_card
        type: UNIQUE
        columns: [applicant_id_card]
    indexes:
      - name: idx_destitute_families_id_card
        columns: [applicant_id_card]
      - name: idx_destitute_families_district
        columns: [district]
      - name: idx_destitute_families_street
        columns: [street]

  - name: nc_biz_destitute_persons
    comment: 特困人员数据表
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: family_id
        type: BIGINT
        comment: 所属家庭ID
      - name: head_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: name
        type: VARCHAR(50)
        nullable: false
        comment: 姓名
      - name: id_card
        type: VARCHAR(18)
        nullable: false
        comment: 身份证号
      - name: relationship
        type: VARCHAR(20)
        comment: 与户主关系
      - name: gender
        type: VARCHAR(10)
        comment: 性别
      - name: birth_date
        type: DATE
        comment: 出生日期
      - name: age
        type: INTEGER
        comment: 年龄
      - name: ethnicity
        type: VARCHAR(20)
        comment: 民族
      - name: marital_status
        type: VARCHAR(20)
        comment: 婚姻状况
      - name: education_level
        type: VARCHAR(20)
        comment: 文化程度
      - name: political_status
        type: VARCHAR(20)
        comment: 政治面貌
      - name: employment_status
        type: VARCHAR(50)
        comment: 就业状况
      - name: annual_income
        type: NUMERIC(12,2)
        comment: 年收入（元）
      - name: is_disabled
        type: BOOLEAN
        default: false
        comment: 是否残疾人
      - name: disability_certificate
        type: VARCHAR(50)
        comment: 残疾证号
      - name: disability_type
        type: VARCHAR(20)
        comment: 残疾类别
      - name: disability_level
        type: VARCHAR(10)
        comment: 残疾等级
      - name: disease_type
        type: VARCHAR(100)
        comment: 患病病种
      - name: self_care_ability
        type: VARCHAR(20)
        comment: 生活自理能力
      - name: health_status
        type: VARCHAR(20)
        comment: 健康状况
      - name: insurance_type
        type: VARCHAR(50)
        comment: 参保类型
      - name: first_receive_month
        type: VARCHAR(10)
        comment: 最初享受月份
      - name: is_poverty_household
        type: BOOLEAN
        default: false
        comment: 是否建档立卡扶贫对象
      - name: bank_name
        type: VARCHAR(100)
        comment: 开户银行
      - name: bank_account_name
        type: VARCHAR(50)
        comment: 银行账户名称
      - name: bank_account
        type: VARCHAR(50)
        comment: 银行帐号
      - name: one_card_account
        type: VARCHAR(50)
        comment: 一卡通账户
      - name: assistance_type
        type: VARCHAR(50)
        comment: 救助类型
      - name: caregiver_name
        type: VARCHAR(50)
        comment: 照料人姓名
      - name: caregiver_id_card
        type: VARCHAR(18)
        comment: 照料人身份证号
      - name: support_mode
        type: VARCHAR(20)
        comment: 供养方式
      - name: support_institution
        type: VARCHAR(100)
        comment: 供养机构
      - name: hukou_type
        type: VARCHAR(20)
        comment: 户籍类型
      - name: basic_living_standard
        type: NUMERIC(12,2)
        comment: 基本生活标准（元）
      - name: care_cost
        type: NUMERIC(12,2)
        comment: 照料护理费用（元）
      - name: family_classified_amount
        type: NUMERIC(12,2)
        comment: 家庭分类施保金额（元）
      - name: total_amount
        type: NUMERIC(12,2)
        comment: 合计（元）
      - name: school_name
        type: VARCHAR(100)
        comment: 在读学校名称
      - name: school_nature
        type: VARCHAR(50)
        comment: 在读学校性质
      - name: enrollment_date
        type: VARCHAR(20)
        comment: 在读学校入学时间
      - name: employer_name
        type: VARCHAR(100)
        comment: 在职单位名称
      - name: employer_nature
        type: VARCHAR(50)
        comment: 在职单位性质
      - name: employer_location
        type: VARCHAR(100)
        comment: 在职单位地点
      - name: remark
        type: TEXT
        comment: 备注
      - name: province
        type: VARCHAR(50)
        comment: 所属省级
      - name: city
        type: VARCHAR(50)
        comment: 所属市级
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区
      - name: hukou_address
        type: VARCHAR(500)
        comment: 户籍地址
      - name: certificate_number
        type: VARCHAR(50)
        comment: 低保（特困）证号
      - name: imported_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_destitute_person_id_card
        type: UNIQUE
        columns: [id_card]
    indexes:
      - name: idx_destitute_persons_id_card
        columns: [id_card]
      - name: idx_destitute_persons_head_id_card
        columns: [head_id_card]
      - name: idx_destitute_persons_family_id
        columns: [family_id]

views: []
