database: other_difficulty
version: 1.0
description: 其他困难人员数据库

tables:
  - name: nc_biz_other_difficulty_families
    comment: 其他困难人员家庭数据表
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: applicant_name
        type: VARCHAR(50)
        nullable: false
        comment: 户主姓名
      - name: applicant_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: guarantee_size
        type: INTEGER
        defaultValue: 0
        comment: 保障人口数
      - name: apply_reason
        type: VARCHAR(100)
        comment: 申请原因（停保转入时为停保原因）
      - name: hukou_type
        type: VARCHAR(20)
        comment: 户籍类型
      - name: phone
        type: VARCHAR(20)
        comment: 联系电话
      - name: address
        type: VARCHAR(500)
        comment: 家庭住址
      - name: province
        type: VARCHAR(50)
        comment: 所属省级
      - name: city
        type: VARCHAR(50)
        comment: 所属市级
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区
      - name: include_month
        type: VARCHAR(10)
        comment: 纳入月份
      - name: member_names
        type: TEXT
        comment: 家庭成员姓名（分号分隔）
      - name: member_id_cards
        type: TEXT
        comment: 家庭成员身份证号（分号分隔）
      - name: source
        type: VARCHAR(20)
        nullable: false
        defaultValue: "'import'"
        comment: 数据来源（import=导入 / stop=非死亡性停保转入）
      - name: source_application_id
        type: BIGINT
        comment: 停保转入来源档案ID（source=stop 时有效）
      - name: imported_at
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_other_difficulty_family_id_card
        type: UNIQUE
        columns: [applicant_id_card]
    indexes:
      - name: idx_other_difficulty_families_id_card
        columns: [applicant_id_card]
      - name: idx_other_difficulty_families_district
        columns: [district]
      - name: idx_other_difficulty_families_street
        columns: [street]
      - name: idx_other_difficulty_families_source_app
        columns: [source_application_id]

  - name: nc_biz_other_difficulty_persons
    comment: 其他困难人员数据表
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: family_id
        type: BIGINT
        comment: 所属家庭ID
      - name: head_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 户主身份证号
      - name: name
        type: VARCHAR(50)
        nullable: false
        comment: 姓名
      - name: id_card
        type: VARCHAR(18)
        nullable: false
        comment: 身份证号
      - name: relationship
        type: VARCHAR(20)
        comment: 与户主关系
      - name: gender
        type: VARCHAR(10)
        comment: 性别
      - name: ethnicity
        type: VARCHAR(20)
        comment: 民族
      - name: marital_status
        type: VARCHAR(20)
        comment: 婚姻状况
      - name: education_level
        type: VARCHAR(20)
        comment: 文化程度
      - name: political_status
        type: VARCHAR(20)
        comment: 政治面貌
      - name: employment_status
        type: VARCHAR(50)
        comment: 就业状况
      - name: monthly_income
        type: NUMERIC(12,2)
        comment: 月收入（元）
      - name: is_disabled
        type: BOOLEAN
        defaultValue: false
        comment: 是否残疾人
      - name: disability_certificate
        type: VARCHAR(50)
        comment: 残疾证号
      - name: disability_type
        type: VARCHAR(20)
        comment: 残疾类别
      - name: disability_level
        type: VARCHAR(10)
        comment: 残疾等级
      - name: work_capacity
        type: VARCHAR(20)
        comment: 劳动能力
      - name: health_status
        type: VARCHAR(20)
        comment: 健康状况
      - name: hukou_type
        type: VARCHAR(20)
        comment: 户籍类型
      - name: is_poverty_policy_population
        type: BOOLEAN
        defaultValue: false
        comment: 是否属脱贫享受政策人口
      - name: region
        type: VARCHAR(200)
        comment: 所属区划
      - name: address
        type: VARCHAR(500)
        comment: 家庭地址
      - name: include_month
        type: VARCHAR(10)
        comment: 纳入月份
      - name: source
        type: VARCHAR(20)
        nullable: false
        defaultValue: "'import'"
        comment: 数据来源（import=导入 / stop=非死亡性停保转入）
      - name: source_application_id
        type: BIGINT
        comment: 停保转入来源档案ID（source=stop 时有效）
      - name: imported_at
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        comment: 导入时间
      - name: updated_at
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        comment: 更新时间
    constraints:
      - name: uk_other_difficulty_person_id_card
        type: UNIQUE
        columns: [id_card]
    indexes:
      - name: idx_other_difficulty_persons_id_card
        columns: [id_card]
      - name: idx_other_difficulty_persons_head_id_card
        columns: [head_id_card]
      - name: idx_other_difficulty_persons_family_id
        columns: [family_id]
      - name: idx_other_difficulty_persons_source_app
        columns: [source_application_id]

  - name: nc_biz_other_difficulty_stops
    comment: 其他困难人员转出/停止记录表（原台账行保留不删，本表记录转出事实与目标档案）
    columns:
      - name: id
        type: BIGSERIAL
        primaryKey: true
        comment: 主键ID
      - name: family_id
        type: BIGINT
        comment: 来源其他困难人员家庭ID（手工补录可为空）
      - name: person_id
        type: BIGINT
        comment: 来源其他困难人员人员ID（手工补录可为空）
      - name: person_name
        type: VARCHAR(50)
        nullable: false
        comment: 转出人员姓名
      - name: person_id_card
        type: VARCHAR(18)
        nullable: false
        comment: 转出人员身份证号
      - name: head_name
        type: VARCHAR(50)
        comment: 原其他困难人员户主姓名
      - name: head_id_card
        type: VARCHAR(18)
        comment: 原其他困难人员户主身份证号
      - name: family_size
        type: INTEGER
        comment: 原家庭保障人口
      - name: hukou_type
        type: VARCHAR(20)
        comment: 户籍类型（农村/城市）
      - name: district
        type: VARCHAR(50)
        comment: 所属区县
      - name: street
        type: VARCHAR(50)
        comment: 所属乡镇/街道
      - name: community
        type: VARCHAR(100)
        comment: 所属社区/村
      - name: address
        type: VARCHAR(500)
        comment: 家庭住址
      - name: include_month
        type: VARCHAR(10)
        comment: 原纳入月份
      - name: old_category
        type: VARCHAR(50)
        defaultValue: "'其他困难人员'"
        comment: 转出前类别
      - name: stop_type
        type: VARCHAR(10)
        nullable: false
        comment: 停止类型：停止=整户转出 / 减员=部分成员转出
      - name: stop_date
        type: DATE
        nullable: false
        comment: 转出/停止日期（审批通过日）
      - name: stop_reason
        type: VARCHAR(200)
        comment: 停止原因（如“转出至最低生活保障对象”）
      - name: target_application_id
        type: BIGINT
        comment: 转入的目标档案ID
      - name: target_classification
        type: VARCHAR(50)
        comment: 转入的目标分类码
      - name: source
        type: VARCHAR(20)
        nullable: false
        defaultValue: "'approval'"
        comment: 数据来源：approval=审批自动 / import_diff=台账比对 / manual=手工补录
      - name: created_at
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        comment: 创建时间
    constraints:
      - name: uk_other_difficulty_stop_person_date
        type: UNIQUE
        columns: [person_id_card, stop_date]
    indexes:
      - name: idx_other_difficulty_stops_person
        columns: [person_id_card]
      - name: idx_other_difficulty_stops_stop_date
        columns: [stop_date]
      - name: idx_other_difficulty_stops_target_app
        columns: [target_application_id]

views: []
