        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: expenditure_type
        type: character varying
        nullable: true
        comment: 支出类型
      - name: amount
        type: numeric
        nullable: true
        comment: 金额
      - name: person_description
        type: character varying
        nullable: true
        comment: 涉及人员说明
      - name: remark
        type: text
        nullable: true
        comment: 备注
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间

  # ───────── 财产子表 ─────────
  
  # ── 房产表 ──
  - name: nc_biz_properties
    comment: 房产表
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: property_type
        type: character varying
        nullable: true
        comment: 房产类型
      - name: address
        type: character varying
        nullable: true
        comment: 房产地址
      - name: housing_structure
        type: character varying
        nullable: true
        comment: 房屋结构
      - name: housing_nature
        type: character varying
        nullable: true
        comment: 房屋性质
      - name: area
        type: numeric
        nullable: true
        comment: 建筑面积
      - name: room_count
        type: integer
        nullable: true
        comment: 房间数量
      - name: build_year
        type: integer
        nullable: true
        comment: 建造年份
      - name: estimated_value
        type: numeric
        nullable: true
        comment: 评估价值
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间

  # ── 车辆表 ──
  - name: nc_biz_vehicles
    comment: 车辆表
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: vehicle_type
        type: character varying
        nullable: true
        comment: 车辆类型
      - name: brand
        type: character varying
        nullable: true
        comment: 车辆品牌
      - name: model
        type: character varying
        nullable: true
        comment: 车辆型号
      - name: license_plate
        type: character varying
        nullable: true
        comment: 车牌号码
      - name: purchase_year
        type: integer
        nullable: true
        comment: 购买年份
      - name: purchase_price
        type: numeric
        nullable: true
        comment: 购买价格
      - name: estimated_value
        type: numeric
        nullable: true
        comment: 评估价值
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间

  # ── 金融资产表 ──
  - name: nc_biz_financial_assets
    comment: 金融资产表
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: has_cash
        type: boolean
        nullable: true
