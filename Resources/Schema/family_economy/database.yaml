# 家庭经济状况数据库Schema定义
# 版本3.0: 与实际数据库表结构完全对齐（2026-07-11）
database: 家庭经济状况数据库
version: 3.0
description: 收入/支出/资产/供养/土地的独立子表，与实际DB一一对应

tables:
  # ───────── 收入子表 ─────────
  
  # ── 务工收入表 ──
  - name: nc_biz_labor_incomes
    comment: 务工收入表，记录家庭成员的工资性收入
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: income_sub_type
        type: character varying
        nullable: true
        comment: 收入子类型
      - name: work_unit
        type: character varying
        nullable: true
        comment: 工作单位
      - name: work_type
        type: character varying
        nullable: true
        comment: 工作类型
      - name: work_place
        type: character varying
        nullable: true
        comment: 工作地点
      - name: monthly_income
        type: numeric
        nullable: true
        comment: 月收入（元）
      - name: months_worked
        type: integer
        nullable: true
        comment: 工作月数
      - name: annual_income
        type: numeric
        nullable: true
        comment: 年收入（元）
      - name: remark
        type: text
        nullable: true
        comment: 备注
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间
      - name: member_name
        type: character varying
        nullable: true
        comment: 成员姓名
      - name: member_id_card
        type: character varying
        nullable: true
        comment: 成员身份证号
      - name: member_age
        type: integer
        nullable: true
        comment: 成员年龄

  # ── 经营收入表 ──
  - name: nc_biz_business_incomes
    comment: 经营收入表，记录家庭经营性收入
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: company_name
        type: character varying
        nullable: true
        comment: 公司/店铺名称
      - name: vendor_type
        type: character varying
        nullable: true
        comment: 经营类型
      - name: registered_capital
        type: numeric
        nullable: true
        comment: 注册资本
      - name: business_scope
        type: character varying
        nullable: true
        comment: 经营范围
      - name: operating_income
        type: numeric
        nullable: true
        comment: 经营收入
      - name: operating_cost
        type: numeric
        nullable: true
        comment: 经营成本
      - name: net_income
        type: numeric
        nullable: true
        comment: 净收入
      - name: address
        type: character varying
        nullable: true
        comment: 地址
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: member_name
        type: character varying
        nullable: true
        comment: 成员姓名
      - name: member_id_card
        type: character varying
        nullable: true
        comment: 成员身份证号
      - name: member_age
        type: integer
        nullable: true
        comment: 成员年龄
      - name: monthly_income
        type: numeric
        nullable: true
        comment: 月收入

  # ── 财产性收入表 ──
  - name: nc_biz_property_incomes
    comment: 财产性收入表，记录存款利息、租金等收入
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: income_type
        type: character varying
        nullable: true
        comment: 收入类型
      - name: amount
        type: numeric
        nullable: true
        comment: 金额
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: member_name
        type: character varying
        nullable: true
        comment: 成员姓名
      - name: member_id_card
        type: character varying
        nullable: true
        comment: 成员身份证号
      - name: member_age
        type: integer
        nullable: true
        comment: 成员年龄
      - name: property_description
        type: character varying
        nullable: true
        comment: 财产描述
    indexes:
      - name: idx_property_incomes_application_id
        columns: [application_id]

  # ── 转移性收入表 ──
  - name: nc_biz_transfer_incomes
    comment: 转移性收入表，记录养老金、补助等转移性收入
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: income_type
        type: character varying
        nullable: true
        comment: 收入类型
      - name: monthly_amount
        type: numeric
        nullable: true
        comment: 月金额
      - name: months_or_times
        type: integer
        nullable: true
        comment: 发放月数或次数
      - name: total_amount
        type: numeric
        nullable: true
        comment: 总金额
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间
      - name: member_id
        type: bigint
        nullable: true
        comment: 关联家庭成员ID
      - name: member_name
        type: character varying
        nullable: true
        comment: 成员姓名
      - name: member_id_card
        type: character varying
        nullable: true
        comment: 成员身份证号
      - name: member_age
        type: integer
        nullable: true
        comment: 成员年龄

  # ── 其他收入表 ──
  - name: nc_biz_other_incomes
    comment: "[经济状况] 其他收入表 - 记录不属于务工/经营/财产/转移的其他零散收入"
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID，关联 nc_biz_applications.id
      - name: income_type
        type: character varying
        nullable: true
        comment: 收入类型（自定义分类，如临时工、馈赠等）
      - name: amount
        type: numeric
        nullable: true
        comment: 金额（元）
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间（软删除标记）

  # ── 补贴表 ──
  - name: nc_biz_subsidies
    comment: "[经济状况] 农业补贴明细表 - 记录家庭各类农业补贴（地力/大豆/玉米/轮作），按面积×单价计算，支持份额系数"
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID，关联 nc_biz_applications.id
      - name: subsidy_type
        type: character varying
        nullable: false
        comment: 补贴类型：地力补贴/大豆补贴/玉米补贴/地表水水稻/地下水水稻/轮作补贴
      - name: area
        type: numeric
        nullable: true
        comment: 面积（亩）
      - name: unit_price
        type: numeric
        nullable: true
        comment: 单价（元/亩）
      - name: count
        type: integer
        nullable: true
        comment: 数量/倍数（用于多茬作物）
      - name: ratio_factor
        type: numeric
        nullable: true
        comment: 份额系数（0-1，用于按户内份额分配补贴）
      - name: original_amount
        type: numeric
        nullable: true
        comment: 原始金额（元）= 面积 × 单价 × 数量
      - name: amount
        type: numeric
        nullable: true
        comment: 实际金额（元）= 原始金额 × 份额系数
      - name: member_name
        type: character varying
        nullable: true
        comment: 关联成员姓名（补贴归属人）
      - name: member_id_card
        type: character varying
        nullable: true
        comment: 关联成员身份证号
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: updated_at
        type: timestamp without time zone
        nullable: true
        comment: 更新时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间（软删除标记）

  # ── 养殖收入表 ──
  - name: nc_biz_breeding_incomes
    comment: "[经济状况] 养殖收入表 - 记录家庭养殖收入（牛/羊/猪/禽类等）"
    columns:
      - name: id
        type: bigint
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: application_id
        type: bigint
        nullable: false
        comment: 关联申请ID
      - name: breeding_type
        type: character varying
        nullable: true
        comment: 养殖类型
      - name: quantity
        type: integer
        nullable: true
        comment: 数量
      - name: annual_income
        type: numeric
        nullable: true
        comment: 年收入
      - name: remark
        type: text
        nullable: true
        comment: 备注
      - name: created_at
        type: timestamp without time zone
        nullable: true
        comment: 创建时间
      - name: deleted_at
        type: timestamp without time zone
        nullable: true
        comment: 删除时间
    indexes:
      - name: idx_breeding_incomes_application_id
        columns: [application_id]

  # ───────── 支出 ─────────
  
  # ── 刚性支出表 ──
  - name: nc_biz_rigid_expenditures
    comment: 刚性支出表
    columns:
      - name: id
        type: bigint
        nullable: false
