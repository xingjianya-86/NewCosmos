<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #525659; overflow: auto; }
    #container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 0;
        gap: 12px;
    }
    .page-wrapper {
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        line-height: 0;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    #loading {
        color: #aaa; font-family: sans-serif; font-size: 16px;
        margin-top: 40vh; text-align: center;
    }
    #error {
        color: #ff5252; font-family: sans-serif; font-size: 14px;
        margin-top: 40vh; text-align: center; display: none;
    }
</style>
</head>
<body>
<div id="loading">正在加载 PDF...</div>
<div id="error"></div>
<div id="container"></div>

<script src="./pdf.min.js"></script>
<script>
(function() {
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

    var container = document.getElementById('container');
    var loadingEl = document.getElementById('loading');
    var errorEl = document.getElementById('error');

    function renderPdfFromData(base64Data) {
        loadingEl.style.display = 'block';
        errorEl.style.display = 'none';
        container.innerHTML = '';

        try {
            var raw = atob(base64Data);
            var arr = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);

            pdfjsLib.getDocument({ data: arr }).promise.then(function(pdf) {
                loadingEl.style.display = 'none';

                // 获取容器可用宽度
                var containerWidth = container.parentElement.clientWidth - 40;
                if (containerWidth < 200) containerWidth = 600;

                // 用第一页计算缩放：让 PDF 宽度适配容器，高度按比例
                pdf.getPage(1).then(function(firstPage) {
                    var baseViewport = firstPage.getViewport({ scale: 1 });

                    // 缩放比例 = 容器宽度 / PDF 原始宽度
                    // 这样 PDF 每一页的宽度刚好填满容器，高度按 A4 比例自适应
                    var scale = containerWidth / baseViewport.width;

                    var renderPromises = [];
                    for (var i = 1; i <= pdf.numPages; i++) {
                        (function(pageNum) {
                            renderPromises.push(pdf.getPage(pageNum).then(function(page) {
                                var viewport = page.getViewport({ scale: scale });
                                var canvas = document.createElement('canvas');
                                var ctx = canvas.getContext('2d');

                                // 设置 canvas 物理像素（高 DPI 适配）
                                var dpr = window.devicePixelRatio || 1;
                                canvas.width = viewport.width * dpr;
                                canvas.height = viewport.height * dpr;
                                canvas.style.width = viewport.width + 'px';
                                canvas.style.height = viewport.height + 'px';
                                ctx.scale(dpr, dpr);

                                var wrapper = document.createElement('div');
                                wrapper.className = 'page-wrapper';
                                wrapper.appendChild(canvas);
                                container.appendChild(wrapper);

                                return page.render({ canvasContext: ctx, viewport: viewport }).promise;
                            }));
                        })(i);
                    }

                    Promise.all(renderPromises);
                });
            }).catch(function(e) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = 'PDF 渲染失败: ' + e.message;
            });
        } catch(e) {
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorEl.textContent = 'PDF 解码失败: ' + e.message;
        }
    }

    window._loadPdfFromBase64 = function(b64) {
        renderPdfFromData(b64);
    };
})();
</script>
</body>
</html>
