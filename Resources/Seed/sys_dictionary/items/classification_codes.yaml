    data:
      # 低保类（官方名称：最低生活保障对象；城乡同值，按 hukou_type 区分）
      - { id: 1001, category: "ClassificationCodes", item_key: "RuralSubsistence", item_value: "最低生活保障对象", sort_order: 1, is_active: true }
      - { id: 1002, category: "ClassificationCodes", item_key: "UrbanSubsistence", item_value: "最低生活保障对象", sort_order: 2, is_active: true }
