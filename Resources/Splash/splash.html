<?xml version="1.0" encoding="utf-8" ?>
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>帝皇权杖δ-me13 社会救助管理系统</title>
<!-- 启动动画：dsh-startup-screen（MIT © 沈宏宏）二次开发版，改动见 THIRD-PARTY-NOTICES.md -->
<link rel="stylesheet" href="splash.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 动画挂载点：结构与上游 preview/index.html 保持一致 -->
<div id="dsh-startup-root" class="dsu-root dsu-boot"></div>

<!-- 1) 运行时配置（C# 每次启动生成：身份、品牌文案、配色、音效开关） -->
<script src="config.js"></script>
<!-- 2) 宿主桥：done / error 事件 → newcosmos-splash:// 自定义协议 -->
<script src="bridge.js"></script>
<!-- 3) 运行时 core 引擎（配置/DOM/音效/台词/标题栏/时间线/收尾，7 个模块） -->
<script src="core/anim-config.js"></script>
<script src="core/anim-dom.js"></script>
<!-- 音频嵌入包（prepare_splash_audio.ps1 生成）：mp3 零请求 -->
<script src="core/anim-audio-assets.js"></script>
<script src="core/anim-audio.js"></script>
<script src="core/anim-voice.js"></script>
<script src="core/anim-chrome.js"></script>
<script src="core/anim-timeline.js"></script>
<script src="core/anim-runtime.js"></script>
<!-- 4) 五幕场景（黑幕 / 洗白 / 档案底板 / 五步验证 / 终幕揭幕） -->
<script src="scenes/scene-brand.js"></script>
<script src="scenes/scene-wash.js"></script>
<script src="scenes/scene-plate.js"></script>
<script src="scenes/scene-verify.js"></script>
<script src="scenes/scene-finale.js"></script>
<!-- 5) 编排器：按原时序串起五幕（已本地化：品牌标识、音频路径） -->
<script src="splash.js"></script>
</body>
</html>
