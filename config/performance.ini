# 性能配置文件
# 此文件包含性能相关参数配置

[Retry]
MaxRetries=3
RetryDelayMilliseconds=1000
ExponentialBackoff=true

# 原 [Timeout] 节（ConnectionTimeoutSeconds/CommandTimeoutSeconds）为死配置：ConfigService
# 无解析分支、实际生效值来自 config\database.ini（Timeout/Command Timeout），2026-11 已删除防误导。

[Thresholds]
SlowOperationThresholdMs=500
# 以下打印三键：已解析入 PerformanceOptions 且 Validate 强制 >0，但暂无运行时消费者
#（OfficeComWorker 按设计约定用 120 秒常量，见其 TODO 注释）。保留仅为不触发 Validate；
# 接通或移除需同步改 Models\Options\PerformanceOptions.Validate。
PrintTaskTimeoutMinutes=5
PrintRetryBaseDelayMs=2000
PrintRetryIncrementMs=1000
PermissionCacheMinutes=3
PermissionVersionCheckIntervalSeconds=30
# 数据中心页四段数据最小刷新间隔（秒）：返回该页在此间隔内不重跑加载；0=每次进入都刷新
DataCenterReloadSeconds=30

# 连接池/连接超时实际生效来源 = config\database.ini（Pooling/Min/Max/Timeout/Command Timeout，
# 消费点 PostgreSqlDatabaseService 构造）。原 [ConnectionPool]/[Timeout] 两节在 ConfigService
# 无解析分支（改了不生效的死配置，2026-11 已删除防误导调优）。