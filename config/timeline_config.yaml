# 业务时间线参数配置
# 参考设计方案：第十章 业务时间线设计

# ── 时间线配置 ──
timelines:
  # 经济复核时间线
  economic_review:
    end_day: 10                    # 每月截止日（10号）
    cycle_days: 30                 # 复核周期天数
    weekend_adjust: "previous_workday"  # 周末调整策略：previous_workday=顺延至前一个工作日

  # 业务流程时间线
  business_process:
    # 统计结算日：周期 = [上月(结算日+1)日, 本月结算日]（结算日当天仍属本周期）。
    # 2026-09 起上级业务截止 20 号 → 20；实际生效值由 app.ini 的 BCycleSettleDay 注入
    # （BusinessCycleHelper，本文件该键仅作文档描述）；统计/月报/档案周期口径统一走 BusinessTimelineService。
    cycle_end_day: 20              # 统计结算日（20号）；原 15 号
    cycle_start_offset: -30        # 周期开始偏移量（负数表示向前推30天）
    meeting_day: 7                 # 会议日（每月7号，遇非工作日顺延）
    acceptance_deadline_offset: -3 # 受理截止偏移量（会议日前3个工作日）
    publicity_days: 7              # 公示天数（会议次日起）
    holiday_check_days: "结算日前5天~结算日"  # 惩罚检查窗口（随结算日浮动，非固定日历日）
    holiday_penalty_days: 5        # 命中**法定节假日**时结算日提前天数（周末不触发惩罚，
                                   # 由结算日自身的 previous_workday 调整处理——若把周末也算进惩罚
                                   # 会因 6 天窗口必含周末而恒触发，结算日永远被压到 settle-5）
    weekend_adjust: "previous_workday"  # 周末调整策略

  # 临时救助验收时间线（C线；以验收日为锚，公示/入户调查日历日倒推）
  # 说明（2026-10-18 重构 / 2026-10-20 归属修订）：权威实现为 BusinessTimelineService.CalculateCLine
  # 与 CalculateCLineForApplyDate，本段仅作文档描述。
  # 验收日固定每月13号（非工作日顺延至其后最近工作日）；公示止=验收日前1天、公示起=验收日前3天
  # （均日历日，不排工作日）；入户调查窗口=[验收日前5天, 公示起日]。
  # 归属：申请日 ≤ 当月验收日归本月，超过验收日顺延下月（申请日期不改写、不钳制）；
  # 细则见 docs\20261020_临时救助C线申请日期归属滚动.md。
  temp_relief:
    acceptance_day: 13               # 验收日固定日历日（必为工作日，非工作日顺延至其后最近工作日）
    publicity_end_offset: -1         # 公示止 = 验收日 − 1（日历日，不排工作日）
    publicity_start_offset: -3       # 公示起 = 验收日 − 3（日历日，不排工作日）
    investigation_start_offset: -5   # 入户调查窗口起日 = 验收日 − 5（日历日）；截止 = 公示起日
    apply_date_roll_after_acceptance: true  # 申请日超过验收日 → 归属下月批次；申请日期仅"晚于今天"被拉回今天

# ── 节假日服务配置 ──
# 现状说明（2026-09）：节假日数据已数据化，权威来源为 nc_sys_holidays 表（值班模块维护：
# 节假日维护页 API 下载 / 手工增删）；HolidayService 以内存快照读取该表。
# 本段为参数描述文档，代码未读取（阈值以内置常量与 nc_duty_settings 为准）。
holiday_service:
  data_source: "database"          # 数据源：database=nc_sys_holidays 表（API 下载或手工维护）
  fallback: "static_2026"          # 兜底：表为空时使用内置 2026 年静态快照（HolidayService 内置）
  api_url: "https://timor.tech/api/holiday/year/{year}"  # 下载接口；可在 nc_duty_settings.holiday_api_url 覆盖
