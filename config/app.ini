# 应用配置文件
# 此文件包含应用元数据与偏好键名配置

[General]
Version=1.2.20261106
ApplicationName=帝皇权杖δ-me13
WindowTitle=帝皇权杖δ-me13 社会救助管理系统

[Storage]
BackupDirectoryName=Backups
LogDirectoryName=Logs
TempDirectoryName=Temp
TemplateCachePath=Cache/Templates
UseAppDataDirectory=true

[Preferences]
RememberMeKey=RememberMe
RememberedUsernameKey=RememberedUsername
RememberedPasswordKey=RememberedPassword
RememberPasswordKey=RememberPassword

[Export]
ExportBaseDirectoryName=帝皇权杖δ-me13
ExportSchemaReportDirectory=Schema检查报告
ExportArchiveDirectory=档案导出
ExportMonthlyReportDirectory=月报表
ExportDataBackupDirectory=数据备份
ExportSystemLogDirectory=系统日志
UseDocumentsDirectory=true

[Business]
# B 线（业务线/月报）统计结算日：周期 = [上月(结算日+1)日, 本月结算日]（结算日当天仍属本周期）。
# 默认 15；上级业务截止 20 号 → 20。周期口径统一走 BusinessTimelineService（含结算日遇法定节假日提前），
# 统计/月报/档案公示与卷号同源（BusinessCycleHelper 仅提供本参数）。
BCycleSettleDay=20

[Change]
# 保障金变更登记阈值（元/月）：动态管理（经济复核/家庭成员变更/户主死亡变更）停旧建新后，
# 旧档与新档同属最低生活保障群体时，户月保障金差 ≥ 本值才登记"保障金变更"
# （进月报保障金增发/减发表、《档案_增员减员调整表》增发/减发格、变更告知书待遇调整场景）；
# < 本值照常停旧建新、新档按新金额，但不登记（不进月报，文书两格显示 0.00）。
# 口径：仅户月保障金（household_monthly_guarantee_amount，不含分类施保与照料费）。
# 分类施保为固定档位标准，不适用本阈值——只要有变动一律另行记录。
FundChangeThreshold=10

[Network]
# ZeroTier CLI 搜索路径（分号分隔；留空用内置默认）
ZeroTierCliPaths=
# ZeroTier 本地管理令牌路径（留空用内置默认）
ZeroTierTokenPath=

[Splash]
# 启动动画（dsh-startup-screen 二次开发版）：每次启动播全片（约 16 秒），右上角 SKIP / Esc 可跳过。
# SplashEnabled=0 关闭动画（回落白底"正在启动…"过渡页）；SplashSound=0 静音（真声台词 + 音效）。
# SplashSpeed 0.35–3（1=原速，0.5=半速）；SplashRequireInteraction=1 时第 1、2 步点击按钮/回车才继续。
# SplashTimeoutSeconds：脚本异常兜底超时（10–180 秒），到点强制进登录页；半速播放需相应调大。
SplashEnabled=1
SplashSound=1
SplashSpeed=0.8
SplashRequireInteraction=0
SplashTimeoutSeconds=90

[Android]
# 安卓端系统栏形态：
#   Immersive（默认）= 沉浸式全屏，隐藏状态栏与导航栏（从屏幕边缘下滑可临时呼出），
#                      内容顶到屏幕最上沿，无任何系统栏。
#   EdgeToEdge      = 状态栏透明、内容延伸到状态栏底下，但时钟/电量仍可见。
FullscreenMode=Immersive