# 月报表模块 Schema 定义
# 来源说明（2026-07-27）：
#   nc_biz_monthly_reports 在生产库 pg_dump（backup/db/new_cosmos_20260727_054917.sql）中不存在，
#   运行日志存在 42P01 relation does not exist 报错。本定义依据代码使用重建：
#   - Services/Domain/Reporting/MonthlyReportService.cs（INSERT 列清单 / 查询条件）
#   - Services/Domain/Reporting/IMonthlyReportService.cs（MonthlyReport / MonthlyReportSummary 实体）
#   - Services/Domain/Reporting/PrintService.cs（SELECT * 按 year+month 单行查询）
#   uk_monthly_reports_year_month 为代码逻辑推断（生成前按 year+month 查重，且按 year+month 单行读取）。
database: 月报表模块
version: 1.0
description: 救助业务月报表（按年月生成的档案统计汇总）

tables:
  - name: nc_biz_monthly_reports
    comment: 月报表
    columns:
      - name: id
        type: BIGSERIAL
        nullable: false
        primaryKey: true
        comment: 主键ID
      - name: year
        type: INTEGER
        nullable: false
        comment: 报表年份
      - name: month
        type: INTEGER
        nullable: false
        comment: 报表月份
      - name: town
        type: VARCHAR(100)
        nullable: false
        defaultValue: "'全部'"
        comment: 乡镇（全部=全县汇总）
      - name: report_type
        type: VARCHAR(20)
        nullable: false
        defaultValue: "'Monthly'"
        comment: 报表类型（Monthly-月报）
      - name: status
        type: VARCHAR(20)
        nullable: false
        defaultValue: "'Generated'"
        comment: 报表状态（Generated-已生成）
      - name: total_archives
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 月末在保档案总数
      - name: new_archives
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 本月新增档案数
      - name: stopped_archives
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 本月停保档案数
      - name: total_amount
        type: NUMERIC(18,2)
        nullable: false
        defaultValue: '0'
        comment: 月末在保总金额（元）
      - name: new_amount
        type: NUMERIC(18,2)
        nullable: false
        defaultValue: '0'
        comment: 本月新增金额（元）
      - name: rural_subsistence_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 农村低保人数
      - name: urban_subsistence_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 城市低保人数
      - name: rural_low_income_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 农村低收入人数
      - name: urban_low_income_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 城市低收入人数
      - name: rural_destitute_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 农村特困人数（分散+集中）
      - name: urban_destitute_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 城市特困人数（分散+集中）
      - name: rigid_expenditure_count
        type: INTEGER
        nullable: false
        defaultValue: '0'
        comment: 刚性支出困难家庭人数（农村+城市）
      - name: generated_by
        type: VARCHAR(100)
        nullable: true
        comment: 生成人（实体字段，当前代码未写入）
      - name: generated_at
        type: TIMESTAMP
        nullable: false
        defaultValue: 'NOW()'
        comment: 生成时间
      - name: created_at
        type: TIMESTAMP
        nullable: false
        defaultValue: 'NOW()'
        comment: 创建时间
    constraints:
      - name: uk_monthly_reports_year_month
        type: UNIQUE
        columns: [year, month]
